name: Build Questify CA Android APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Android application ID
        required: false
        default: com.bramhalab.questifyca
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CAPACITOR_APP_ID: ${{ inputs.app_id || 'com.bramhalab.questifyca' }}
      CAPACITOR_APP_NAME: Questify CA

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # IMPORTANT: Do not request the obsolete Android SDK "tools" package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source
        shell: bash
        run: |
          set -euo pipefail
          test -f questify-ca.zip || {
            echo "ERROR: questify-ca.zip is missing from repository root."
            exit 1
          }
          mkdir -p app-source
          unzip -q questify-ca.zip -d app-source
          test -f app-source/package.json || {
            echo "ERROR: package.json not found after extracting questify-ca.zip."
            find app-source -maxdepth 3 -type f | head -80
            exit 1
          }

      - name: Install dependencies
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Configure Capacitor
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const appId = process.env.CAPACITOR_APP_ID;
          const appName = process.env.CAPACITOR_APP_NAME;

          if (!/^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$/.test(appId)) {
            throw new Error(`Invalid Android application ID: ${appId}`);
          }

          const configPath = path.resolve('capacitor.config.json');
          const existingConfigFiles = [
            'capacitor.config.ts',
            'capacitor.config.js',
            'capacitor.config.mjs'
          ];

          const existing = existingConfigFiles.filter(fs.existsSync);
          if (existing.length) {
            throw new Error(
              `Found ${existing.join(', ')}. Add appId, appName and webDir to the existing Capacitor config instead of generating JSON.`
            );
          }

          let config = {};
          if (fs.existsSync(configPath)) {
            config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          }

          config.appId = config.appId || appId;
          config.appName = config.appName || appName;
          config.webDir = config.webDir || 'dist';

          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          console.log('Capacitor config:', config);
          NODE

      - name: Build web application
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html || {
            echo "ERROR: dist/index.html not found. Check the app's build output directory."
            exit 1
          }

      - name: Initialize or sync Android project
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi

          if [ -f scripts/generate-icons.mjs ]; then
            node scripts/generate-icons.mjs
          fi

          npx cap sync android

      - name: Build debug APK
        working-directory: app-source/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: questify-ca-android-debug-apk
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
